        :root {
          --bg: #FFFBF0;
          --card: #FFFFFF;
          --sage: #7A9B76;
          --sage-deep: #5C7D59;
          --sage-light: #EAF0E8;
          --sage-mid: #D6E2D3;
          --brown: #8A6B55;
          --brown-dark: #4A3728;
          --brown-light: #F5EDE3;
          --border: #EFE5D3;
          --border-strong: #E2D5BA;
          --text: #3E352D;
          --text-mid: #7A7067;
          --text-light: #A99E93;
          --shadow: 0 8px 30px rgba(74,55,40,0.07), 0 2px 8px rgba(74,55,40,0.04);

        * { box-sizing: border-box; }
        html, body { margin:0; padding:0; }
        body { background: var(--bg); color: var(--text); }
        .app-shell {
          min-height: 100vh;
          background: radial-gradient(1200px 600px at 20% -10%, #EAF0E8 0%, transparent 60%), radial-gradient(900px 500px at 90% 0%, #FDF1DC 0%, transparent 60%), var(--bg);
          font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
          padding-top: var(--safe-area-inset-top);
          overflow-x: clip;
        }
        .serif { font-family: "Fraunces", Georgia, serif; }
        .container { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
        @media (min-width: 768px){ .container{ padding: 0 28px; } }

        .header {
          position: sticky;
          top: var(--safe-area-inset-top);
          z-index: 20;
          backdrop-filter: blur(16px);
          background: rgba(255,251,240,0.88);
          border-bottom: 1px solid var(--border);
        }
        .header-inner { display:flex; align-items:center; gap:16px; padding: 18px 0; }
        .logo-mark { width:44px; height:44px; border-radius: 13px; background: linear-gradient(135deg, var(--sage) 0%, var(--sage-deep) 100%); display:grid; place-items:center; color:white; box-shadow: 0 4px 14px rgba(92,125,89,0.32); flex-shrink:0; }
        .header h1 { margin:0; font-size: clamp(20px, 2.8vw, 26px); font-weight:600; letter-spacing:-0.02em; line-height:1.15; }
        .header p { margin: 4px 0 0; font-size: 13px; color: var(--text-mid); font-style: italic; }

        .stats { display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap:12px; margin-bottom: 16px; }
        .stat { background: var(--card); border:1px solid var(--border); border-radius: var(--radius-sm); padding:16px 18px; box-shadow: var(--shadow); min-width:0; }
        .stat-label { font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color: var(--text-light); font-weight:600; }
        .stat-value { font-size:26px; font-weight:600; margin-top:4px; letter-spacing:-0.02em; }
        @media (max-width: 600px){ .stats{ grid-template-columns: 1fr 1fr 1fr; } .stat{ padding:12px 10px; } .stat-value{ font-size:20px; } }

        .main-grid { display:grid; grid-template-columns: 380px minmax(0,1fr); gap:24px; margin-top:28px; align-items:start; max-width:100%; }
        @media (max-width: 980px){ .main-grid{ grid-template-columns: 1fr; } .form-sticky{ position: static !important; } }

        .card { background: var(--card); border:1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow:hidden; max-width:100%; min-width:0; }
        .card-header { padding: 22px 24px 0; }
        .card-body { padding: 20px 24px 24px; }
        .card-title { font-size: 18px; font-weight:600; letter-spacing:-0.01em; display:flex; align-items:center; gap:10px; }
        .badge { font-size:10px; padding:4px 10px; border-radius:999px; background: var(--sage-light); color: var(--sage-deep); font-weight:600; letter-spacing:0.04em; text-transform:uppercase; }

        .form-grid { display:grid; gap:16px; }
        label { font-size:13px; font-weight:500; color: var(--brown-dark); display:block; margin-bottom:6px; }
        label span.req { color:#C06A4A; margin-left:3px; }
        input, textarea {

          background:#FFFEFB; font-family: inherit; font-size:14px; color: var(--text);
          transition: all 0.18s; outline:none;
        }
        input:focus, textarea:focus { border-color: var(--sage); background: white; box-shadow: 0 0 0 4px var(--sage-light); }
        textarea { resize: vertical; min-height:88px; line-height:1.5; }
        .two-col { display:grid; grid-template-columns:1fr 1fr; gap:12px; }

        .btn-primary {
          width:100%; padding:13px 18px; border-radius: 12px; border:none;
          background: linear-gradient(135deg, var(--brown-dark) 0%, #6B4E3D 100%);
          color: white; font-weight:600; font-size:14px; letter-spacing:0.01em;
          cursor:pointer; box-shadow: 0 6px 18px rgba(74,55,40,0.22);
          transition: transform 0.12s, box-shadow 0.12s;
          display:flex; align-items:center; justify-content:center; gap:8px;

        .btn-primary:disabled { opacity:0.6; cursor:not-allowed; transform:none; }
        .btn-ghost { padding:9px 14px; border-radius:10px; border:1px solid var(--border); background: var(--card); font-size:13px; cursor:pointer; font-weight:500; color: var(--text-mid); }
        .btn-ghost:hover { border-color: var(--border-strong); color: var(--text); background: var(--brown-light); }
        .btn-excel { padding:10px 16px; border-radius:11px; border:1px solid #C2D9C3; background: white; font-size:13px; cursor:pointer; font-weight:600; color: var(--sage-deep); display:inline-flex; align-items:center; gap:8px; box-shadow: 0 2px 8px rgba(92,125,89,0.08); }
        .btn-excel:hover { background: var(--sage-light); border-color: var(--sage-mid); }

        @keyframes spin { to { transform: rotate(360deg) } }
        .spinner { width:16px; height:16px; border:2px solid rgba(255,255,255,0.4); border-top-color:white; border-radius:50%; animation: spin 0.7s linear infinite; display:inline-block; }
        .spinner-dark { border-color: rgba(74,55,40,0.2); border-top-color: var(--brown-dark); }

        .table-toolbar { display:flex; flex-wrap:wrap; gap:10px; justify-content:space-between; align-items:center; padding: 20px 24px; border-bottom:1px solid var(--border); background: linear-gradient(to bottom, #FFFEFB, var(--card)); max-width:100%; }
        .search-wrap { position:relative; flex: 1 1 220px; max-width:320px; }

        .search-icon { position:absolute; left:12px; top:50%; transform:translateY(-50%); color: var(--text-light); font-size:14px; }
        .toolbar-actions { display:flex; gap:8px; flex-wrap:wrap; }
        .table-wrap { overflow:auto; max-width:100%; }
        table { width:100%; border-collapse:collapse; min-width: 780px; }
        th { text-align:left; font-size:11px; letter-spacing:0.07em; text-transform:uppercase; color: var(--text-light); font-weight:600; padding:14px 16px; border-bottom:1px solid var(--border); background:#FFFEFB; white-space:nowrap; }
        td { padding:14px 16px; font-size:13.5px; vertical-align:top; border-bottom:1px solid #F5EDE3; line-height:1.45; }
        tr:last-child td { border-bottom:none; }

        .pill { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; font-size:11.5px; font-weight:600; letter-spacing:0.01em; }
        .pill-sick { background:#FDE8E0; color:#A44A2E; }

        .empty { padding: 56px 24px; text-align:center; }

        .toast { position: fixed; left:50%; bottom:24px; transform: translateX(-50%); background: var(--brown-dark); color: #FFFBF0; padding:12px 18px; border-radius:999px; font-size:13px; font-weight:500; box-shadow: var(--shadow-lg); z-index:100; display:flex; gap:10px; align-items:center; animation: toastIn .22s ease; max-width: calc(100vw - 32px); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
