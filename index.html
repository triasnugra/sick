        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,ital,wght@9..144,0,400;9..144,0,600;9..144,1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap');
        :root {
          --bg: #FFFBF0;
          --card: #FFFFFF;
          --sage: #7A9B76;
          --sage-deep: #5C7D59;
          --sage-light: #EAF0E8;
          --sage-mid: #D6E2D3;
          --brown: #8A6B55;
          --brown-dark: #4A3728;
          --brown-light: #F5EDE3;
          --border: #EFE5D3;
          --border-strong: #E2D5BA;
          --text: #3E352D;
          --text-mid: #7A7067;
          --text-light: #A99E93;
          --shadow: 0 8px 30px rgba(74,55,40,0.07), 0 2px 8px rgba(74,55,40,0.04);
          --shadow-lg: 0 20px 50px rgba(74,55,40,0.12);
          --radius: 20px;
          --radius-sm: 12px;
          --safe-area-inset-top: 0px;
        }
        * { box-sizing: border-box; }
        html, body { margin:0; padding:0; }
        body { background: var(--bg); color: var(--text); }
        .app-shell {
          min-height: 100vh;
          background: radial-gradient(1200px 600px at 20% -10%, #EAF0E8 0%, transparent 60%), radial-gradient(900px 500px at 90% 0%, #FDF1DC 0%, transparent 60%), var(--bg);
          font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
          padding-top: var(--safe-area-inset-top);
        }
        .serif { font-family: "Fraunces", Georgia, serif; }
        .container { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
        @media (min-width: 768px){ .container{ padding: 0 28px; } }

        .header {
          position: sticky;
          top: var(--safe-area-inset-top);
          z-index: 20;
          backdrop-filter: blur(16px);
          background: rgba(255,251,240,0.84);
          border-bottom: 1px solid var(--border);
        }
        .header-inner { display:flex; align-items:center; justify-content:space-between; padding: 18px 0; gap:16px; flex-wrap: wrap; }
        .logo-mark { width:40px; height:40px; border-radius: 12px; background: linear-gradient(135deg, var(--sage) 0%, var(--sage-deep) 100%); display:grid; place-items:center; color:white; font-size:18px; box-shadow: 0 4px 12px rgba(92,125,89,0.3); }
        .header h1 { margin:0; font-size: clamp(18px, 2.5vw, 26px); font-weight:600; letter-spacing:-0.02em; line-height:1.15; }
        .header p { margin: 4px 0 0; font-size: 13px; color: var(--text-mid); font-style: italic; }

        .stats { display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap:12px; margin: 20px 0 0; max-width:100%; }
        .stat { background: var(--card); border:1px solid var(--border); border-radius: var(--radius-sm); padding:14px 16px; box-shadow: var(--shadow); min-width:0; }
        .stat-label { font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color: var(--text-light); font-weight:600; }
        .stat-value { font-size:22px; font-weight:600; margin-top:2px; letter-spacing:-0.02em; }
        @media (max-width: 600px){ .stats{ grid-template-columns: 1fr; width:100%; } .header-inner .stats{ grid-template-columns: repeat(3, minmax(0,1fr)); width:auto; } }

        .main-grid { display:grid; grid-template-columns: 380px minmax(0,1fr); gap:24px; margin-top:28px; align-items:start; max-width:100%; overflow-x: clip; }
        @media (max-width: 980px){ .main-grid{ grid-template-columns: 1fr; } }

        .card { background: var(--card); border:1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow:hidden; max-width:100%; min-width:0; }
        .card-header { padding: 22px 24px 0; }
        .card-body { padding: 20px 24px 24px; }
        .card-title { font-size: 18px; font-weight:600; letter-spacing:-0.01em; display:flex; align-items:center; gap:10px; }
        .badge { font-size:10px; padding:4px 8px; border-radius:999px; background: var(--sage-light); color: var(--sage-deep); font-weight:600; letter-spacing:0.04em; text-transform:uppercase; }

        .form-grid { display:grid; gap:16px; }
        label { font-size:13px; font-weight:500; color: var(--brown-dark); display:block; margin-bottom:6px; }
        label span.req { color:#C06A4A; margin-left:3px; }
        input, textarea {
          width:100%; padding:11px 14px; border-radius:12px; border:1.5px solid var(--border);
          background:#FFFEFB; font-family: inherit; font-size:14px; color: var(--text);
          transition: all 0.18s; outline:none;
        }
        input:focus, textarea:focus { border-color: var(--sage); background: white; box-shadow: 0 0 0 4px var(--sage-light); }
        textarea { resize: vertical; min-height:88px; line-height:1.5; }
        .two-col { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        @media (max-width:480px){ .two-col{ grid-template-columns:1fr; } }
        .btn-primary {
          width:100%; padding:13px 18px; border-radius: 12px; border:none;
          background: linear-gradient(135deg, var(--brown-dark) 0%, #6B4E3D 100%);
          color: white; font-weight:600; font-size:14px; letter-spacing:0.01em;
          cursor:pointer; box-shadow: 0 6px 18px rgba(74,55,40,0.22);
          transition: transform 0.12s, box-shadow 0.12s;
          display:flex; align-items:center; justify-content:center; gap:8px;
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(74,55,40,0.28); }
        .btn-primary:active { transform: translateY(0); }
        .btn-primary:disabled { opacity:0.6; cursor:not-allowed; transform:none; }
        .btn-ghost { padding:9px 14px; border-radius:10px; border:1px solid var(--border); background: var(--card); font-size:13px; cursor:pointer; font-weight:500; color: var(--text-mid); }
        .btn-ghost:hover { border-color: var(--border-strong); color: var(--text); background: var(--brown-light); }

        .fb-banner { border-radius: 12px; padding: 12px 14px; font-size: 12.5px; line-height:1.5; border:1px solid; display:flex; gap:10px; align-items:flex-start; margin-bottom: 14px; }
        .fb-banner.warn { background:#FFF8E1; border-color:#F5E0A0; color:#7A5A10; }
        .fb-banner.ok { background:#EAF4EB; border-color:#C2D9C3; color:#2F5D32; }
        .fb-banner.conn { background:#E8F0FE; border-color:#C2D3F0; color:#2C4A7A; }
        .fb-banner.err { background:#FDE8E0; border-color:#F0B8A8; color:#8A2E1A; }
        .fb-dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-top:5px; flex-shrink:0; }
        .fb-dot.ok { background:#4CAF50; box-shadow:0 0 0 4px rgba(76,175,80,0.18); animation: pulse 1.8s infinite; }
        .fb-dot.warn { background:#FFB300; }
        .fb-dot.conn { background:#3B82F6; }
        .fb-dot.err { background:#E53935; }
        @keyframes pulse { 0%{ box-shadow:0 0 0 0 rgba(76,175,80,0.3)} 70%{ box-shadow:0 0 0 6px rgba(76,175,80,0)} 100%{ box-shadow:0 0 0 0 rgba(76,175,80,0)} }
        @keyframes spin { to { transform: rotate(360deg) } }
        .spinner { width:16px; height:16px; border:2px solid rgba(255,255,255,0.4); border-top-color:white; border-radius:50%; animation: spin 0.7s linear infinite; display:inline-block; }
        .spinner-dark { border-color: rgba(74,55,40,0.2); border-top-color: var(--brown-dark); }

        .table-toolbar { display:flex; flex-wrap:wrap; gap:10px; justify-content:space-between; align-items:center; padding: 20px 24px; border-bottom:1px solid var(--border); background: linear-gradient(to bottom, #FFFEFB, var(--card)); max-width:100%; }
        .search-wrap { position:relative; flex: 1 1 220px; max-width:320px; }
        .search-wrap input { padding-left: 36px; background: var(--bg); }
        .search-icon { position:absolute; left:12px; top:50%; transform:translateY(-50%); color: var(--text-light); font-size:14px; }
        .toolbar-actions { display:flex; gap:8px; flex-wrap:wrap; }
        .table-wrap { overflow:auto; max-width:100%; }
        table { width:100%; border-collapse:collapse; min-width: 780px; }
        th { text-align:left; font-size:11px; letter-spacing:0.07em; text-transform:uppercase; color: var(--text-light); font-weight:600; padding:14px 16px; border-bottom:1px solid var(--border); background:#FFFEFB; white-space:nowrap; }
        td { padding:14px 16px; font-size:13.5px; vertical-align:top; border-bottom:1px solid #F5EDE3; line-height:1.45; }
        tr:last-child td { border-bottom:none; }
        tr:hover td { background: #FFFEFB; }
        .pill { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; font-size:11.5px; font-weight:600; letter-spacing:0.01em; }
        .pill-sick { background:#FDE8E0; color:#A44A2E; }
        .pill-healed { background: var(--sage-light); color: var(--sage-deep); }
        .pill-progress { background:#FFF3D6; color:#8A6A1E; }
        .dot { width:6px; height:6px; border-radius:50%; display:inline-block; }
        .dot-sick { background:#E07A5F; } .dot-healed{ background: var(--sage); } .dot-progress{ background:#E6B422; }
        .action-btns { display:flex; gap:6px; flex-wrap:wrap; }
        .icon-btn { width:30px; height:30px; border-radius:9px; border:1px solid var(--border); background: var(--card); display:grid; place-items:center; cursor:pointer; font-size:13px; transition: all .15s; }
        .icon-btn:hover { border-color: var(--border-strong); transform: translateY(-1px); }
        .icon-btn.danger:hover { background:#FDE8E0; border-color:#E8B0A0; }
        .empty { padding: 56px 24px; text-align:center; }
        .empty-ill { width:88px; height:88px; margin:0 auto 18px; border-radius: 24px; background: linear-gradient(135deg, var(--sage-light), #F5EDE3); display:grid; place-items:center; font-size:36px; border:1px dashed var(--border-strong); }
        .empty h4 { margin:0; font-size:16px; font-weight:600; }
        .empty p { margin:8px auto 0; max-width:360px; font-size:13.5px; color: var(--text-mid); line-height:1.6; }

        .quote-section { margin-top:28px; max-width:100%; }
        .quote-card {
          position:relative; overflow:hidden;
          background: linear-gradient(135deg, #E8EFE6 0%, #DCE6D9 45%, #EAF2E8 100%);
          border:1px solid #CBD9C7; border-radius: 24px; padding: 28px 28px 24px;
          box-shadow: var(--shadow); max-width:100%;
        }
        .quote-ornament { position:absolute; top:-28px; right: -12px; width: 160px; height: 160px; opacity:0.09; color: var(--sage-deep); pointer-events:none; }
        .quote-ornament svg { width:100%; height:100%; }
        .quote-arab { font-family: "Fraunces", serif; font-size: clamp(18px, 3vw, 26px); color: var(--sage-deep); line-height:1.6; direction: rtl; text-align: right; opacity:0.9; margin-bottom:16px; letter-spacing:0.02em; }
        .quote-text { font-size: clamp(15px, 2vw, 18px); line-height:1.7; color: var(--brown-dark); font-style: italic; max-width: 700px; position:relative; z-index:1; }
        .quote-source { margin-top:12px; font-size:12.5px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color: var(--sage-deep); }
        .quote-actions { margin-top:18px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
        .dots { display:flex; gap:6px; }
        .dot-q { width:6px; height:6px; border-radius:50%; background: #C2D1BE; transition: all .2s; }
        .dot-q.active { width:20px; background: var(--sage-deep); }
        .toast { position: fixed; left:50%; bottom:24px; transform: translateX(-50%); background: var(--brown-dark); color: #FFFBF0; padding:12px 18px; border-radius:999px; font-size:13px; font-weight:500; box-shadow: var(--shadow-lg); z-index:100; display:flex; gap:10px; align-items:center; animation: toastIn .22s ease; max-width: calc(100vw - 32px); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        @keyframes toastIn { from{ transform: translateX(-50%) translateY(12px); opacity:0 } to{ transform: translateX(-50%) translateY(0); opacity:1 } }

        .setup { margin-top:28px; }
